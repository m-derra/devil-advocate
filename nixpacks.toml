# Nixpacks config for Railway deployment
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = [
  "cd packages/shared && bun run build",
  "cd packages/web && bun run build",
  "mkdir -p packages/api/public",
  "cp -r packages/web/dist/* packages/api/public/"
]

[start]
cmd = "cd packages/api && bun run start"
